<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Live Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400">Public Live Chat</h1>
        <span id="username-display" class="text-sm text-gray-300"></span>
    </header>

    <!-- Messages Box -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></div>

    <!-- Input Form -->
    <form id="chat-form" onsubmit="postMessage(event)" class="bg-gray-800 p-3 border-t border-gray-700 flex gap-2">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off"
            class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-medium">Send</button>
    </form>

    <script>
        const SUPABASE_URL = 'https://dtdcywegbilszwlbiyvh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8v0SCUFZ-LAxGb0VcY5MLg_xyLtRkfy';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myName = localStorage.getItem('chat_user') || ('User_' + Math.floor(Math.random() * 9000 + 1000));
        localStorage.setItem('chat_user', myName);
        document.getElementById('username-display').textContent = myName;

        async function loadMessages() {
            const { data, error } = await client
                .from('messages')
                .select('*')
                .order('id', { ascending: true })
                .limit(50);

            if (error) {
                console.error(error);
                return;
            }

            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            data.forEach(m => renderMsg(m));
            box.scrollTop = box.scrollHeight;
        }

        function renderMsg(m) {
            const box = document.getElementById('chat-box');
            const isMe = m.username === myName;
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-gray-400 mb-0.5">${escapeHtml(m.username)}</span>
                <div class="${isMe ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-200'} px-3 py-2 rounded-xl text-sm max-w-xs break-words">
                    ${escapeHtml(m.content || '')}
                </div>
            `;
            box.appendChild(div);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function postMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const { error } = await client
                .from('messages')
                .insert([{ username: myName, content: text }]);

            if (error) {
                alert('Error: ' + error.message);
                return;
            }
            input.value = '';
        }

        // Real-time sync listener
        client
            .channel('messages-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderMsg(payload.new);
                const box = document.getElementById('chat-box');
                box.scrollTop = box.scrollHeight;
            })
            .subscribe();

        loadMessages();
    </script>
</body>
</html>

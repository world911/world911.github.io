<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="app-body" class="bg-[#18191a] text-[#e4e6eb] h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header id="app-header" class="bg-[#242526] border-b border-[#393a3b] px-4 py-3 flex justify-between items-center shadow-md transition-colors duration-300">
        <div class="flex items-center gap-3">
            <div id="header-icon" class="w-10 h-10 rounded-full bg-[#0084ff] flex items-center justify-center font-bold text-white shadow flex-shrink-0">💬</div>
            <div>
                <h1 class="text-base font-semibold leading-tight flex items-center gap-2">
                    Live Chat
                    <span class="text-[11px] font-normal text-emerald-400 flex items-center gap-1 bg-[#3a3b3c] px-2 py-0.5 rounded-full">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> <span id="online-count">1</span> Online
                    </span>
                </h1>
                <!-- UTC+6 Bangladesh Time & Date Clock on a single line -->
                <span id="live-clock" class="text-xs text-slate-400 font-medium whitespace-nowrap">Loading...</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Theme Toggle Text/Icon Button -->
            <button onclick="toggleTheme()" id="theme-btn" class="bg-[#3a3b3c] hover:bg-[#4e4f50] text-xs px-2.5 py-2 rounded-lg text-slate-200 transition flex items-center gap-1.5 font-medium" title="Switch Theme">
                <span id="theme-icon">🟢</span> <span id="theme-text">WhatsApp</span>
            </button>
            <span id="username-display" class="text-xs text-slate-300 font-medium bg-[#3a3b3c] px-2.5 py-2 rounded-lg border border-[#4e4f50] truncate max-w-[80px]"></span>
            <!-- Edit Name Icon Button -->
            <button onclick="changeName()" class="bg-[#3a3b3c] hover:bg-[#4e4f50] p-2 rounded-lg text-slate-200 transition flex items-center justify-center" title="Edit Name">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Messages Box -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></main>

    <!-- Media Preview Bar -->
    <div id="media-preview-container" class="px-4 hidden bg-[#242526] py-2 border-t border-[#393a3b] flex items-center justify-between transition-colors duration-300">
        <span id="file-name-display" class="text-xs text-blue-400 truncate"></span>
        <button onclick="clearMedia()" class="text-rose-400 hover:text-rose-300 text-xs font-medium">Remove</button>
    </div>

    <!-- Input Footer -->
    <footer id="app-footer" class="bg-[#242526] border-t border-[#393a3b] p-3 transition-colors duration-300">
        <form id="chat-form" onsubmit="postMessage(event)" class="flex items-center gap-2 max-w-4xl mx-auto">
            <!-- File Upload Button -->
            <label class="cursor-pointer bg-[#3a3b3c] hover:bg-[#4e4f50] p-2.5 rounded-full text-slate-300 transition flex items-center justify-center shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                </svg>
                <input type="file" id="media-file" class="hidden" accept="image/*,video/*" onchange="previewFile()">
            </label>

            <!-- Text Input -->
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off"
                class="flex-1 bg-[#3a3b3c] text-white px-4 py-2.5 rounded-full focus:outline-none focus:ring-1 focus:ring-blue-500 border border-transparent text-sm">

            <!-- Send Button -->
            <button type="submit" id="send-btn" class="bg-[#0084ff] hover:bg-[#006dd6] text-white px-5 py-2.5 rounded-full text-sm font-medium transition shadow flex items-center justify-center">Send</button>
        </form>
    </footer>

    <script>
        const SUPABASE_URL = 'https://dtdcywegbilszwlbiyvh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8v0SCUFZ-LAxGb0VcY5MLg_xyLtRkfy';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // UTC+6 Bangladesh Time & Date Clock (Single Line)
        function updateLiveClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const bdTime = new Date(utc + (6 * 3600000));
            
            let hours = bdTime.getHours();
            const minutes = String(bdTime.getMinutes()).padStart(2, '0');
            const seconds = String(bdTime.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[bdTime.getMonth()];
            const day = bdTime.getDate();
            
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds} ${ampm} ${month} ${day}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        let myName = localStorage.getItem('chat_user') || ('User_' + Math.floor(Math.random() * 9000 + 1000));
        localStorage.setItem('chat_user', myName);
        document.getElementById('username-display').textContent = myName;

        let currentTheme = localStorage.getItem('chat_theme') || 'messenger';

        function toggleTheme() {
            currentTheme = currentTheme === 'messenger' ? 'whatsapp' : 'messenger';
            localStorage.setItem('chat_theme', currentTheme);
            applyTheme();
            loadMessages();
        }

        function applyTheme() {
            const body = document.getElementById('app-body');
            const header = document.getElementById('app-header');
            const footer = document.getElementById('app-footer');
            const preview = document.getElementById('media-preview-container');
            const headerIcon = document.getElementById('header-icon');
            const sendBtn = document.getElementById('send-btn');
            const themeText = document.getElementById('theme-text');
            const themeIcon = document.getElementById('theme-icon');

            if (currentTheme === 'whatsapp') {
                body.className = "bg-[#0b141a] text-slate-100 h-screen flex flex-col justify-between transition-colors duration-300";
                header.className = "bg-[#202c33] border-b border-[#222d34] px-4 py-3 flex justify-between items-center shadow-md transition-colors duration-300";
                footer.className = "bg-[#202c33] border-t border-[#222d34] p-3 transition-colors duration-300";
                preview.className = "px-4 hidden bg-[#202c33] py-2 border-t border-[#222d34] flex items-center justify-between transition-colors duration-300";
                headerIcon.className = "w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-white shadow flex-shrink-0";
                sendBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition shadow flex items-center justify-center";
                themeText.textContent = "Messenger";
                themeIcon.textContent = "💬";
            } else {
                body.className = "bg-[#18191a] text-[#e4e6eb] h-screen flex flex-col justify-between transition-colors duration-300";
                header.className = "bg-[#242526] border-b border-[#393a3b] px-4 py-3 flex justify-between items-center shadow-md transition-colors duration-300";
                footer.className = "bg-[#242526] border-t border-[#393a3b] p-3 transition-colors duration-300";
                preview.className = "px-4 hidden bg-[#242526] py-2 border-t border-[#393a3b] flex items-center justify-between transition-colors duration-300";
                headerIcon.className = "w-10 h-10 rounded-full bg-[#0084ff] flex items-center justify-center font-bold text-white shadow flex-shrink-0";
                sendBtn.className = "bg-[#0084ff] hover:bg-[#006dd6] text-white px-5 py-2.5 rounded-full text-sm font-medium transition shadow flex items-center justify-center";
                themeText.textContent = "WhatsApp";
                themeIcon.textContent = "🟢";
            }
        }

        applyTheme();

        function changeName() {
            const newName = prompt('Enter your new name:', myName);
            if (newName && newName.trim() !== '') {
                myName = newName.trim();
                localStorage.setItem('chat_user', myName);
                document.getElementById('username-display').textContent = myName;
            }
        }

        let selectedFile = null;

        function previewFile() {
            const fileInput = document.getElementById('media-file');
            if (fileInput.files.length > 0) {
                selectedFile = fileInput.files[0];
                document.getElementById('file-name-display').textContent = 'Attached: ' + selectedFile.name;
                document.getElementById('media-preview-container').classList.remove('hidden');
            }
        }

        function clearMedia() {
            selectedFile = null;
            document.getElementById('media-file').value = '';
            document.getElementById('media-preview-container').classList.add('hidden');
        }

        async function loadMessages() {
            const { data, error } = await client
                .from('messages')
                .select('*')
                .order('id', { ascending: true })
                .limit(50);

            if (error) { console.error(error); return; }

            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            data.forEach(m => renderMsg(m));
            box.scrollTop = box.scrollHeight;
        }

        function renderMsg(m) {
            const box = document.getElementById('chat-box');
            const isMe = m.username === myName;
            const div = document.createElement('div');
            div.id = `msg-${m.id}`;
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-full my-1`;

            let mediaHTML = '';
            if (m.media_url) {
                if (m.media_type && m.media_type.startsWith('video/')) {
                    mediaHTML = `<video src="${m.media_url}" controls class="max-w-xs sm:max-w-sm rounded-lg mt-1.5 max-h-60"></video>`;
                } else {
                    mediaHTML = `<a href="${m.media_url}" target="_blank"><img src="${m.media_url}" class="max-w-xs sm:max-w-sm rounded-lg mt-1.5 max-h-60 object-cover border border-[#393a3b]"></a>`;
                }
            }

            let bubbleBg = '';
            if (currentTheme === 'whatsapp') {
                bubbleBg = isMe ? 'bg-[#005c4b] text-[#e9edef]' : 'bg-[#202c33] text-[#e9edef]';
            } else {
                bubbleBg = isMe ? 'bg-[#0084ff] text-white' : 'bg-[#3a3b3c] text-[#e4e6eb]';
            }

            div.innerHTML = `
                <div class="flex items-center gap-2 mb-0.5 px-1">
                    <span class="text-[11px] font-medium ${currentTheme === 'whatsapp' ? 'text-emerald-400' : 'text-blue-400'}">${escapeHtml(m.username)}</span>
                    <button onclick="adminDelete(${m.id})" class="text-[10px] text-rose-400 hover:text-rose-300 font-semibold opacity-50 hover:opacity-100 transition" title="Admin Delete">×</button>
                </div>
                <div class="${bubbleBg} px-3.5 py-2 rounded-2xl text-sm max-w-xs sm:max-w-md break-words shadow-md relative">
                    ${m.content ? escapeHtml(m.content) : ''}
                    ${mediaHTML}
                    <div class="text-[9px] text-slate-300 text-right mt-1 opacity-70">
                        ${m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}
                    </div>
                </div>
            `;
            box.appendChild(div);
        }

        async function adminDelete(id) {
            const code = prompt('Enter Admin Password to delete message:');
            if (code !== 'chudlingpong') {
                if (code !== null) alert('Incorrect admin password!');
                return;
            }

            const { error } = await client
                .from('messages')
                .delete()
                .eq('id', id);

            if (error) alert('Delete failed: ' + error.message);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function postMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            let mediaUrl = null;
            let mediaType = null;

            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                const { error: uploadError } = await client.storage.from('chat-media').upload(fileName, selectedFile);
                if (uploadError) { alert('Upload error: ' + uploadError.message); return; }
                const { data: publicUrlData } = client.storage.from('chat-media').getPublicUrl(fileName);
                mediaUrl = publicUrlData.publicUrl;
                mediaType = selectedFile.type;
            }

            const { error } = await client.from('messages').insert([{
                username: myName,
                content: text,
                media_url: mediaUrl,
                media_type: mediaType
            }]);

            if (error) { alert('Error: ' + error.message); return; }
            input.value = '';
            clearMedia();
        }

        // Real-time Active Presence Tracking using Supabase Presence
        const presenceChannel = client.channel('online-users-room');
        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                const totalOnline = Object.keys(state).length;
                document.getElementById('online-count').textContent = totalOnline > 0 ? totalOnline : 1;
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await presenceChannel.track({ user: myName, online_at: new Date().toISOString() });
                }
            });

        client
            .channel('messages-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderMsg(payload.new);
                const box = document.getElementById('chat-box');
                box.scrollTop = box.scrollHeight;
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
                const el = document.getElementById(`msg-${payload.old.id}`);
                if (el) el.remove();
            })
            .subscribe();

        loadMessages();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Live Chat</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            Public Live Chat
        </h1>
        <div class="flex items-center gap-2">
            <span id="current-username" class="text-sm text-gray-300 font-medium"></span>
            <button onclick="changeUsername()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded transition">Change Name</button>
        </div>
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
        <!-- Messages will load here dynamically -->
    </main>

    <!-- Typing Indicator / Preview Bar -->
    <div id="media-preview-container" class="px-4 hidden bg-gray-800 py-2 border-t border-gray-700 flex items-center justify-between">
        <span id="file-name-display" class="text-xs text-emerald-400 truncate"></span>
        <button onclick="clearMedia()" class="text-red-400 hover:text-red-300 text-xs">Remove</button>
    </div>

    <!-- Input Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 p-3">
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center gap-2 max-w-4xl mx-auto">
            <!-- File Upload Button -->
            <label class="cursor-pointer bg-gray-700 hover:bg-gray-600 p-2.5 rounded-lg text-gray-300 transition flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                </svg>
                <input type="file" id="media-file" class="hidden" accept="image/*,video/*" onchange="previewFile()">
            </label>

            <!-- Text Input -->
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off"
                class="flex-1 bg-gray-700 text-white px-4 py-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-gray-600 text-sm">

            <!-- Send Button -->
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition flex items-center justify-center">
                Send
            </button>
        </form>
    </footer>

    <!-- Application Script -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://dtdcywegbilszwlbiyvh.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8v0SCUFZ-LAxGb0VcY5MLg_xyLtRkfy';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // Handle User Identity Storage
        let username = localStorage.getItem('chat_username');
        if (!username) {
            username = 'User_' + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('chat_username', username);
        }
        document.getElementById('current-username').textContent = username;

        function changeUsername() {
            const newName = prompt('Enter your new chat name:', username);
            if (newName && newName.trim() !== '') {
                username = newName.trim();
                localStorage.setItem('chat_username', username);
                document.getElementById('current-username').textContent = username;
            }
        }

        let selectedFile = null;

        function previewFile() {
            const fileInput = document.getElementById('media-file');
            if (fileInput.files.length > 0) {
                selectedFile = fileInput.files[0];
                document.getElementById('file-name-display').textContent = 'Attached: ' + selectedFile.name;
                document.getElementById('media-preview-container').classList.remove('hidden');
            }
        }

        function clearMedia() {
            selectedFile = null;
            document.getElementById('media-file').value = '';
            document.getElementById('media-preview-container').classList.add('hidden');
        }

        // Fetch initial messages
        async function fetchMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                console.error('Error fetching messages:', error);
                return;
            }

            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            data.forEach(msg => appendMessage(msg));
            scrollToBottom();
        }

        // Render individual messages
        function appendMessage(msg) {
            const chatWindow = document.getElementById('chat-window');
            const isMe = msg.username === username;

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-full`;

            let mediaHTML = '';
            if (msg.media_url) {
                if (msg.media_type && msg.media_type.startsWith('video/')) {
                    mediaHTML = `<video src="${msg.media_url}" controls class="max-w-xs sm:max-w-sm rounded-lg mt-2 max-h-60"></video>`;
                } else {
                    mediaHTML = `<a href="${msg.media_url}" target="_blank"><img src="${msg.media_url}" class="max-w-xs sm:max-w-sm rounded-lg mt-2 max-h-60 object-cover"></a>`;
                }
            }

            messageDiv.innerHTML = `
                <div class="flex items-baseline gap-2 mb-1">
                    <span class="text-xs font-semibold text-emerald-400">${escapeHtml(msg.username)}</span>
                    <span class="text-[10px] text-gray-400">${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <div class="${isMe ? 'bg-emerald-700 text-white' : 'bg-gray-800 text-gray-200'} px-4 py-2.5 rounded-2xl shadow-sm text-sm break-words max-w-xs sm:max-w-md border border-gray-700">
                    ${msg.content ? escapeHtml(msg.content) : ''}
                    ${mediaHTML}
                </div>
            `;

            chatWindow.appendChild(messageDiv);
        }

        function scrollToBottom() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Send Message Handler
        async function sendMessage(e) {
            e.preventDefault();
            const inputField = document.getElementById('message-input');
            const text = inputField.value.trim();

            if (!text && !selectedFile) return;

            let mediaUrl = null;
            let mediaType = null;

            // Upload file if selected
            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 7))}.${fileExt}`;
                const filePath = `${fileName}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('chat-media')
                    .upload(filePath, selectedFile);

                if (uploadError) {
                    alert('Error uploading file: ' + uploadError.message);
                    return;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('chat-media')
                    .getPublicUrl(filePath);

                mediaUrl = publicUrlData.publicUrl;
                mediaType = selectedFile.type;
            }

            // Insert row into database table
            const { error } = await supabaseClient
                .from('messages')
                .insert([{
                    username: username,
                    content: text,
                    media_url: mediaUrl,
                    media_type: mediaType
                }]);

            if (error) {
                alert('Error sending message: ' + error.message);
                return;
            }

            // Reset inputs
            inputField.value = '';
            clearMedia();
        }

        // Realtime Subscription to receive new chat entries instantly
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new);
                scrollToBottom();
            })
            .subscribe();

        // Load chat history on launch
        fetchMessages();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Extractor & Copier</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #06b6d4, #3b82f6);
            --current-bg: #1e3a8a;
            --current-border: #3b82f6;
            --copied-bg: #064e3b;
            --copied-border: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .toggle-input-trigger {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .input-section {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 14px;
        }

        .input-section.open {
            display: flex;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 10px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #3b82f6;
        }

        .extract-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .extract-btn:active {
            opacity: 0.8;
        }

        .strip-add-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 14px;
            overflow-x: auto;
        }

        .strip-label {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .pill-btn {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill-btn.active {
            background: var(--text-main);
            color: #0b0f19;
            border-color: var(--text-main);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .next-copy-btn {
            flex: 1;
            background: var(--accent-gradient);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            transition: transform 0.1s;
        }

        .next-copy-btn:active {
            transform: scale(0.98);
        }

        .side-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .counter-badge {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .action-sm-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }

        .action-sm-btn:hover {
            background: #1e293b;
        }

        .clear-history-btn {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
        }

        .reset-all-btn {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
            font-weight: 700;
        }

        .reset-all-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        .list-header {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .number-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .number-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .number-row:hover {
            border-color: var(--text-muted);
        }

        .row-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .row-index {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            width: 20px;
        }

        .row-number {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .number-row.current {
            background: var(--current-bg) !important;
            border-color: var(--current-border) !important;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        .number-row.copied {
            background: var(--copied-bg) !important;
            border-color: var(--copied-border) !important;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-done {
            background: #10b981;
            color: #000;
        }

        .badge-current {
            background: #60a5fa;
            color: #000;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 1.5s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="app-title">Number Extractor & Copier</h1>
        </div>

        <button class="toggle-input-trigger" onclick="toggleInputBox()">
            <span id="toggle-btn-text">Open Number Extract Input Box</span>
            <span id="toggle-arrow">▼</span>
        </button>

        <div class="input-section" id="input-section">
            <label for="raw-input">Paste text with numbers below:</label>
            <textarea id="raw-input" placeholder="Paste text here... numbers will be extracted automatically"></textarea>
            <button class="extract-btn" onclick="extractNumbers()">Extract & Apply</button>
        </div>

        <div class="strip-add-bar">
            <span class="strip-label">Strip / add:</span>
            <button class="pill-btn active" id="mode-full" onclick="setMode('FULL')">FULL</button>
            <button class="pill-btn" id="mode-plus" onclick="setMode('PLUS')">+</button>
            <button class="pill-btn" id="mode-minus2" onclick="setMode('MINUS_2')">-2</button>
            <button class="pill-btn" id="mode-minus3" onclick="setMode('MINUS_3')">-3</button>
        </div>

        <div class="controls-row">
            <button class="next-copy-btn" onclick="copyNext()">Next ▸ Copy</button>
            <div class="side-controls">
                <div class="counter-badge" id="counter-display">0 / 0</div>
                <div class="btn-group">
                    <button class="action-sm-btn clear-history-btn" onclick="clearHistory()" title="Clear Copied History">Clear History</button>
                    <button class="action-sm-btn" onclick="restartList()">Restart</button>
                    <button class="action-sm-btn reset-all-btn" onclick="resetAllData()" title="Wipe Storage & Reset">Reset</button>
                </div>
            </div>
        </div>

        <div class="list-header"><span id="total-count">0</span> numbers</div>
        <div class="number-list" id="number-list-container"></div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script>
        let originalNumbers = [];
        let numbers = [];
        let currentIndex = 0;
        let copiedHistory = new Set();
        let currentMode = 'FULL';
        let isInputOpen = false;

        // Load data from localStorage on start
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
        });

        function saveToLocalStorage() {
            const data = {
                originalNumbers,
                currentIndex,
                copiedHistory: Array.from(copiedHistory),
                currentMode
            };
            localStorage.setItem('numTool_cache', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('numTool_cache');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    originalNumbers = data.originalNumbers || [];
                    currentIndex = data.currentIndex || 0;
                    copiedHistory = new Set(data.copiedHistory || []);
                    currentMode = data.currentMode || 'FULL';
                    
                    updateModeUI();
                    applyModeTransformation();
                    renderList();
                } catch (e) {
                    console.error("Failed to load cache", e);
                }
            }
        }

        function resetAllData() {
            if (confirm("Are you sure you want to completely clear and wipe all data?")) {
                localStorage.removeItem('numTool_cache');
                originalNumbers = [];
                numbers = [];
                currentIndex = 0;
                copiedHistory.clear();
                currentMode = 'FULL';
                updateModeUI();
                renderList();
                showToast("All data wiped successfully");
            }
        }

        function toggleInputBox() {
            isInputOpen = !isInputOpen;
            const section = document.getElementById('input-section');
            const arrow = document.getElementById('toggle-arrow');
            const btnText = document.getElementById('toggle-btn-text');

            if (isInputOpen) {
                section.classList.add('open');
                arrow.textContent = '▲';
                btnText.textContent = 'Hide Input Box';
            } else {
                section.classList.remove('open');
                arrow.textContent = '▼';
                btnText.textContent = 'Open Number Extract Input Box';
            }
        }

        function extractNumbers() {
            const rawText = document.getElementById('raw-input').value;
            const matches = rawText.match(/\d{5,}/g) || [];
            
            originalNumbers = matches;
            applyModeTransformation();
            currentIndex = 0;
            copiedHistory.clear();
            
            saveToLocalStorage();
            renderList();
            toggleInputBox();
        }

        function setMode(mode) {
            currentMode = mode;
            updateModeUI();
            applyModeTransformation();
            saveToLocalStorage();
            renderList();
        }

        function updateModeUI() {
            document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
            if (currentMode === 'FULL') document.getElementById('mode-full').classList.add('active');
            if (currentMode === 'PLUS') document.getElementById('mode-plus').classList.add('active');
            if (currentMode === 'MINUS_2') document.getElementById('mode-minus2').classList.add('active');
            if (currentMode === 'MINUS_3') document.getElementById('mode-minus3').classList.add('active');
        }

        function applyModeTransformation() {
            numbers = originalNumbers.map(num => {
                if (currentMode === 'PLUS') {
                    return '+' + num;
                } else if (currentMode === 'MINUS_2') {
                    return num.length > 2 ? num.substring(2) : num;
                } else if (currentMode === 'MINUS_3') {
                    return num.length > 3 ? num.substring(3) : num;
                } else {
                    return num;
                }
            });
        }

        function renderList() {
            const container = document.getElementById('number-list-container');
            container.innerHTML = '';
            
            document.getElementById('total-count').textContent = numbers.length;
            document.getElementById('counter-display').textContent = `${numbers.length > 0 ? Math.min(currentIndex + 1, numbers.length) : 0} / ${numbers.length}`;

            if (numbers.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">No numbers extracted yet. Click the box above to paste text.</div>';
                return;
            }

            numbers.forEach((num, index) => {
                const row = document.createElement('div');
                row.className = 'number-row';
                
                let badgeHTML = ''; 
                
                if (index === currentIndex) {
                    row.classList.add('current');
                    badgeHTML = '<span class="badge badge-current">CURRENT</span>';
                } else if (copiedHistory.has(index)) {
                    row.classList.add('copied');
                    badgeHTML = '<span class="badge badge-done">COPIED</span>';
                }

                row.innerHTML = `
                    <div class="row-left">
                        <span class="row-index">${index + 1}</span>
                        <span class="row-number">${num}</span>
                    </div>
                    <div>${badgeHTML}</div>
                `;

                row.onclick = () => copySpecificRow(index);
                container.appendChild(row);
            });
        }

        function copyTextToClipboard(text, callback) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`);
                if (callback) callback();
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function copyNext() {
            if (numbers.length === 0) return;
            
            while (currentIndex < numbers.length && copiedHistory.has(currentIndex)) {
                currentIndex++;
            }

            if (currentIndex >= numbers.length) {
                showToast("All numbers have been copied!");
                return;
            }

            const targetNum = numbers[currentIndex];
            copyTextToClipboard(targetNum, () => {
                copiedHistory.add(currentIndex);
                currentIndex++;
                saveToLocalStorage();
                renderList();
                scrollToCurrent();
            });
        }

        function copySpecificRow(index) {
            const targetNum = numbers[index];
            copyTextToClipboard(targetNum, () => {
                copiedHistory.add(index);
                currentIndex = index;
                saveToLocalStorage();
                renderList();
            });
        }

        function restartList() {
            currentIndex = 0;
            copiedHistory.clear();
            saveToLocalStorage();
            renderList();
            showToast("Reset to beginning");
        }

        function clearHistory() {
            copiedHistory.clear();
            currentIndex = 0;
            saveToLocalStorage();
            renderList();
            showToast("Copied history cleared");
        }

        function scrollToCurrent() {
            const container = document.getElementById('number-list-container');
            const currentRowEl = container.children[currentIndex];
            if (currentRowEl) {
                currentRowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 1800);
        }
    </script>
</body>
</html>
